<!DOCTYPE html>
<!-- List manager document. Contains markup for list cards, detail rows, bulk actions, and manager modals. -->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YT Auto Playlist — Списки</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/sync.css" />
    <link rel="stylesheet" href="styles/video-item.css" />
    <link rel="stylesheet" href="styles/status.css" />
    <link rel="stylesheet" href="styles/collection.css" />
    <link rel="stylesheet" href="styles/queue.css" />
    <link rel="stylesheet" href="styles/manager.css" />
    <link rel="stylesheet" href="styles/ytdlp.css" />
  </head>
  <body class="full-page">
    <div id="app">
      <header class="page-header">
        <div>
          <h2>Списки расширения</h2>
          <p>Создавайте, импортируйте и управляйте очередями.</p>
        </div>
        <div class="page-actions">
          <button id="openCreateModal" type="button">Добавить список</button>
          <button id="openImportModal" class="secondary" type="button">
            Импортировать
          </button>
        </div>
      </header>
      <section class="popup-sync manager-sync" aria-label="Синхронизация">
        <span id="managerSyncState" class="popup-sync__state">Синхронизация...</span>
        <span id="managerSyncMeta" class="popup-sync__meta"></span>
        <div class="popup-sync__actions" role="group" aria-label="Действия синхронизации">
          <button
            id="managerSyncPull"
            class="icon-button popup-sync__button"
            type="button"
            title="Слить с облаком"
            aria-label="Слить с облаком"
          >
            <span aria-hidden="true">⇣</span>
          </button>
          <button
            id="managerSyncPush"
            class="icon-button popup-sync__button"
            type="button"
            title="Отправить в облако"
            aria-label="Отправить в облако"
          >
            <span aria-hidden="true">⇡</span>
          </button>
          <button
            id="managerSyncRestore"
            class="icon-button popup-sync__button"
            type="button"
            title="Откатить облако на предыдущую версию"
            aria-label="Откатить облако на предыдущую версию"
            disabled
          >
            <span aria-hidden="true">↶</span>
          </button>
        </div>
      </section>
      <section id="status" hidden>
        <span id="statusText"></span>
        <div id="statusProgress" class="status-progress" hidden>
          <div id="statusProgressBar" class="status-progress-bar"></div>
        </div>
      </section>

      <section class="lists-overview">
        <ul id="listsBody" class="list-cards"></ul>
      </section>

      <section class="queue">
        <div class="detail-actions">
        <div class="detail-selection-group">
          <button id="selectAllBtn" type="button">Выбрать все</button>
          <button id="clearSelectionBtn" class="secondary" type="button">
            Сбросить выбор
          </button>
        </div>
        <div class="detail-bulk-group">
          <button id="openAddLinksModal" type="button" class="secondary">
            Добавить по ссылке
          </button>
          <button
            id="openYtdlpModal"
            type="button"
            class="secondary"
            disabled
          >
            yt-dlp
          </button>
          <button
            id="removeWatchedBtn"
            class="secondary"
            type="button"
            disabled
          >
            Удалить просмотренные
          </button>
          <button id="clearListBtn" type="button" disabled>
            Очистить список
          </button>
        </div>
      </div>
        <section id="managerCollectionArea" class="collection-area" hidden>
          <div class="collection-launch">
            <button id="managerCollectSubscriptions" type="button">
              Собрать из подписок
            </button>
          </div>
          <p id="managerCollectionNote" class="collection-note" hidden></p>
          <section id="managerCollectionProgress" class="collection" hidden>
            <header>
              <div class="collection-info">
                <h4>Сбор подписок</h4>
                <span id="managerCollectionStage"></span>
              </div>
              <div class="collection-actions">
                <span id="managerCollectionCounters"></span>
              </div>
            </header>
            <div class="collection-body">
              <ul id="managerCollectionLog" class="collection-log"></ul>
            </div>
          </section>
        </section>
        <ul id="detailList" class="video-list"></ul>
        <p id="detailEmpty" class="empty" hidden>Список пуст</p>
        <div
          id="floatingSelectionActions"
          class="detail-floating-actions"
          hidden
        >
          <button id="bulkPostponeBtn" class="secondary" type="button" disabled>
            Отложить
          </button>
          <button id="bulkMoveBtn" class="secondary" type="button" disabled>
            Перенести
          </button>
          <button id="bulkDeleteBtn" type="button" disabled>
            Удалить
          </button>
        </div>
      </section>
    </div>

    <div id="modalBackdrop" class="modal-backdrop" hidden></div>

    <div id="createModal" class="modal" hidden>
      <form id="createForm" class="modal-content">
        <h3>Создание списка</h3>
        <label class="modal-field">
          <span>Название</span>
          <input
            id="createName"
            type="text"
            placeholder="Например, Отложить"
            maxlength="80"
            required
          />
        </label>
        <label class="modal-checkbox">
          <input id="createFreeze" type="checkbox" />
          <span>Не удалять просмотренные</span>
        </label>
        <div class="modal-actions">
          <button type="submit">Создать</button>
          <button type="button" class="secondary" data-close-modal>
            Отмена
          </button>
        </div>
      </form>
    </div>

    <div id="importModal" class="modal" hidden>
      <form id="importForm" class="modal-content">
        <h3>Импорт списка</h3>
        <label class="modal-field">
          <span>Файл JSON</span>
          <input
            id="importFile"
            type="file"
            accept="application/json"
            required
          />
        </label>
        <label class="modal-field">
          <span>Куда импортировать</span>
          <select id="importModeSelect">
            <option value="new">Создать новый список</option>
            <option value="append">Добавить к существующему</option>
          </select>
        </label>
        <label class="modal-field" id="importTargetField" hidden>
          <span>Выберите список</span>
          <select id="importTargetSelect"></select>
        </label>
        <div class="modal-actions">
          <button type="submit">Импортировать</button>
          <button type="button" class="secondary" data-close-modal>
            Отмена
          </button>
        </div>
      </form>
    </div>

    <div id="editModal" class="modal" hidden>
      <form id="editForm" class="modal-content">
        <h3>Настройки списка</h3>
        <label class="modal-field">
          <span>Название</span>
          <input id="editName" type="text" maxlength="80" required />
        </label>
        <label class="modal-checkbox">
          <input id="editFreeze" type="checkbox" />
          <span>Не удалять просмотренные</span>
        </label>
        <div class="modal-actions">
          <button type="submit">Сохранить</button>
          <button type="button" class="secondary" data-close-modal>
            Отмена
          </button>
        </div>
      </form>
    </div>

    <div id="addLinksModal" class="modal" hidden>
      <form id="addLinksForm" class="modal-content">
        <h3>Добавление по ссылкам</h3>
        <label class="modal-field">
          <span>Ссылки или ID</span>
          <textarea
            id="addLinksTextarea"
            rows="8"
            placeholder="https://youtu.be/…&#10;https://www.youtube.com/watch?v=…"
            required
          ></textarea>
          <span class="modal-help"
            >Можно вставить несколько ссылок построчно или через пробел.</span
          >
        </label>
        <div class="modal-actions">
          <button type="submit">Добавить</button>
          <button type="button" class="secondary" data-close-modal>
            Отмена
          </button>
        </div>
      </form>
    </div>

    <div id="ytdlpModal" class="modal" hidden>
      <form id="ytdlpForm" class="modal-content modal-content--wide">
        <h3>Команда yt-dlp</h3>
        <div class="modal-grid">
          <label class="modal-field">
            <span>Что скачать</span>
            <select id="ytdlpFormat">
              <option value="best">Видео: лучшее качество</option>
              <option value="mp4">Видео: MP4</option>
              <option value="mp4-720">Видео: MP4 до 720p</option>
              <option value="mp3">Аудио: MP3</option>
              <option value="m4a">Аудио: M4A</option>
            </select>
          </label>
          <label class="modal-field">
            <span>Папка вывода</span>
            <input
              id="ytdlpOutputDir"
              type="text"
              placeholder="Пусто = текущая папка"
            />
          </label>
        </div>
        <div class="modal-checklist">
          <label class="modal-checkbox">
            <input id="ytdlpArchive" type="checkbox" />
            <span>Вести архив скачанных ID</span>
          </label>
          <label class="modal-checkbox">
            <input id="ytdlpNoOverwrites" type="checkbox" checked />
            <span>Не перезаписывать файлы</span>
          </label>
          <label class="modal-checkbox">
            <input id="ytdlpMetadata" type="checkbox" checked />
            <span>Встроить метаданные</span>
          </label>
          <label class="modal-checkbox">
            <input id="ytdlpThumbnail" type="checkbox" />
            <span>Встроить обложку</span>
          </label>
          <label class="modal-checkbox">
            <input id="ytdlpCookies" type="checkbox" />
            <span>Использовать cookies из Chrome</span>
          </label>
        </div>
        <label class="modal-field">
          <span>Готовая команда для PowerShell</span>
          <textarea id="ytdlpCommand" rows="10" readonly></textarea>
          <span id="ytdlpSummary" class="modal-help"></span>
          <span class="modal-help"
            >Для MP3/M4A yt-dlp может временно скачать аудиопоток webm и затем удалить его после конвертации.</span
          >
        </label>
        <div class="modal-actions">
          <button id="copyYtdlpCommand" type="button">Копировать</button>
          <button type="button" class="secondary" data-close-modal>
            Закрыть
          </button>
        </div>
      </form>
    </div>

    <script type="module" src="../../build/lists.js"></script>
  </body>
</html>
